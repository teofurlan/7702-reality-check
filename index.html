<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7702 Reality Check</title>
    <meta name="description" content="The EIP-7702 delegation epidemic is mostly automation, not victims. We measured it." />

    <!-- The octahedron split into the two poles of the behavioural scale.
         SVG first for crisp rendering at any tab size; the 32px PNG is the
         fallback for browsers that will not take an SVG icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#030308" />

    <!-- Social preview. `%SITE_URL%` is substituted at build time by the
         siteUrlHtmlPlugin in vite.config.ts, from Vercel's deploy environment
         or an explicit SITE_URL; scrapers largely ignore a relative og:image,
         so these have to be absolute.

         public/og.png is generated by `npm run og` FROM data/artifact.json
         through the same seams the UI reads, so the card can never advertise a
         figure the page does not show. Re-run it after `npm run measure`. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="7702 Reality Check" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="7702 Reality Check" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="7702 Reality Check" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
